<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PS171 Privacy Agent</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="logo-group">
          <span class="shield-icon">[SHIELD]</span>
          <div>
            <h1 class="title">PS171 Privacy Shield</h1>
            <p class="subtitle">WXT On-Device Vision Agent</p>
          </div>
        </div>
        <div class="status-indicator">
          <span class="status-dot"></span>
          <span id="status-text">Ready</span>
        </div>
      </header>

      <!-- Master Actions -->
      <div class="action-card">
        <button id="btn-scan" class="primary-btn">
          <span class="btn-icon">[FAST]</span>
          <span class="btn-text">Scan & Protect Tab</span>
        </button>
        <div class="secondary-row">
          <button id="btn-clear" class="secondary-btn" title="Clear all in-page privacy masks">
            <span>Clear Masks</span>
          </button>
          <button id="btn-test-lab" class="secondary-btn btn-lab" title="Open In-Browser Diagnostic Lab">
            <span> Test Lab</span>
          </button>
        </div>
      </div>

      <!-- 4 Privacy Detection Metrics Grid -->
      <div class="metrics-grid">
        <div class="metric-card metric-face">
          <div class="metric-icon"></div>
          <div class="metric-val" id="stat-face">0</div>
          <div class="metric-label">Faces</div>
        </div>
        <div class="metric-card metric-pwd">
          <div class="metric-icon">[SECURE]</div>
          <div class="metric-val" id="stat-pwd">0</div>
          <div class="metric-label">Passwords</div>
        </div>
        <div class="metric-card metric-pii">
          <div class="metric-icon"></div>
          <div class="metric-val" id="stat-pii">0</div>
          <div class="metric-label">PII Fields</div>
        </div>
        <div class="metric-card metric-text">
          <div class="metric-icon">[SHIELD]</div>
          <div class="metric-val" id="stat-text">0</div>
          <div class="metric-label">Sensitive Text</div>
        </div>
      </div>

      <!-- Performance & Status Row -->
      <div class="meta-row">
        <div class="meta-item">
          <span class="meta-label">Inference:</span>
          <span id="stat-latency" class="meta-val">-- ms</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Engine:</span>
          <span id="stat-device" class="meta-val">WXT Client / Local</span>
        </div>
      </div>

      <!-- Snapshot Preview Panel -->
      <div id="preview-panel" class="preview-panel hidden">
        <div class="preview-header">
          <span>Live Detection Snapshot</span>
          <span id="preview-count" class="preview-badge">0 detections</span>
        </div>
        <div class="preview-img-wrapper">
          <img id="preview-img" src="" alt="Detection Snapshot" />
        </div>
      </div>

      <!-- Settings Controls -->
      <div class="settings-card">
        <div class="settings-header">
          <span> Privacy & Inference Settings</span>
        </div>

        <!-- Masking Style -->
        <div class="setting-group">
          <label class="setting-label">Masking Style</label>
          <div class="segmented-control">
            <label class="segment-opt">
              <input type="radio" name="maskStyle" value="blur" checked />
              <span>Blur</span>
            </label>
            <label class="segment-opt">
              <input type="radio" name="maskStyle" value="redact" />
              <span>Redact</span>
            </label>
            <label class="segment-opt">
              <input type="radio" name="maskStyle" value="outline" />
              <span>Outline</span>
            </label>
          </div>
        </div>

        <!-- Confidence Threshold Slider -->
        <div class="setting-group">
          <div class="slider-header">
            <label class="setting-label" for="slider-conf">Detection Confidence Threshold</label>
            <span id="val-conf" class="slider-val">25%</span>
          </div>
          <input type="range" id="slider-conf" min="10" max="90" value="25" class="slider" />
        </div>

        <!-- Class Filter Toggles -->
        <div class="setting-group">
          <label class="setting-label">Protected Categories</label>
          <div class="checkbox-grid">
            <label class="check-item">
              <input type="checkbox" id="chk-face" checked />
              <span> Faces</span>
            </label>
            <label class="check-item">
              <input type="checkbox" id="chk-pwd" checked />
              <span>[SECURE] Passwords</span>
            </label>
            <label class="check-item">
              <input type="checkbox" id="chk-pii" checked />
              <span> PII Fields</span>
            </label>
            <label class="check-item">
              <input type="checkbox" id="chk-text" checked />
              <span>[SHIELD] Sensitive Text</span>
            </label>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <footer class="footer">
        <span>ISRO PS171 (SIH26171) • WXT Extension Framework</span>
      </footer>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
