<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shannon Entropy Formula (H > 4.5)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      display: inline-block;
      padding: 16px 28px;
    }
    math {
      font-family: "Latin Modern Math", "STIX Two Math", "Cambria Math", "Times New Roman", serif;
      font-size: 32px;
      color: #000000;
    }
  </style>
</head>
<body>
<math display="block">
  <mrow>
    <mi>H</mi><mo stretchy="false">(</mo><mi>X</mi><mo stretchy="false">)</mo>
    <mo>=</mo>
    <mo>&#x2212;</mo>
    <munderover>
      <mo>&#x2211;</mo>
      <mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow>
      <mi>n</mi>
    </munderover>
    <mi>P</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mo stretchy="false">)</mo>
    <msub><mo lspace="0.15em" rspace="0.15em">log</mo><mn>2</mn></msub>
    <mi>P</mi><mo stretchy="false">(</mo><msub><mi>x</mi><mi>i</mi></msub><mo stretchy="false">)</mo>
    <mspace width="1em"/>
    <mo stretchy="false">(</mo><mi>H</mi><mo>&gt;</mo><mn>4.5</mn><mo stretchy="false">)</mo>
  </mrow>
</math>
</body>
</html>
