<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sub-Pixel Viewport Normalization Formula</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      display: inline-block;
      padding: 16px 28px;
    }
    math {
      font-family: "Latin Modern Math", "STIX Two Math", "Cambria Math", "Times New Roman", serif;
      font-size: 32px;
      color: #000000;
    }
  </style>
</head>
<body>
<math display="block">
  <mrow>
    <msub><mi>X</mi><mtext>norm</mtext></msub>
    <mo>=</mo>
    <mfrac>
      <msub><mi>X</mi><mtext>client</mtext></msub>
      <msub><mi>W</mi><mtext>viewport</mtext></msub>
    </mfrac>
    <mo>,</mo>
    <mspace width="1.5em"/>
    <msub><mi>Y</mi><mtext>norm</mtext></msub>
    <mo>=</mo>
    <mfrac>
      <msub><mi>Y</mi><mtext>client</mtext></msub>
      <msub><mi>H</mi><mtext>viewport</mtext></msub>
    </mfrac>
  </mrow>
</math>
</body>
</html>
