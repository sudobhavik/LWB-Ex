<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dihedral Group D5 Verhoeff Aadhaar Formula</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      display: inline-block;
      padding: 16px 28px;
    }
    math {
      font-family: "Latin Modern Math", "STIX Two Math", "Cambria Math", "Times New Roman", serif;
      font-size: 32px;
      color: #000000;
    }
  </style>
</head>
<body>
<math display="block">
  <mrow>
    <mtext mathvariant="bold">CheckDigit</mtext>
    <mo stretchy="false">(</mo><mi>c</mi><mo stretchy="false">)</mo>
    <mo>=</mo>
    <mtext>inv</mtext>
    <mrow><mo>(</mo>
      <munderover>
        <mo>&#x2211;</mo>
        <mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow>
        <mi>n</mi>
      </munderover>
      <mi>F</mi>
      <mo stretchy="false">(</mo>
      <mi>i</mi>
      <mo lspace="0.25em" rspace="0.25em">mod</mo>
      <mn>8</mn>
      <mo>,</mo>
      <msub><mi>d</mi><mi>i</mi></msub>
      <mo stretchy="false">)</mo>
      <mo>&#x2208;</mo>
      <msub><mi>D</mi><mn>5</mn></msub>
    <mo>)</mo></mrow>
  </mrow>
</math>
</body>
</html>
