<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Anchor Fusion IoU NMS Formula</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #ffffff;
      display: inline-block;
      padding: 16px 28px;
    }
    math {
      font-family: "Latin Modern Math", "STIX Two Math", "Cambria Math", "Times New Roman", serif;
      font-size: 32px;
      color: #000000;
    }
  </style>
</head>
<body>
<math display="block">
  <mrow>
    <mtext mathvariant="bold">IoU</mtext>
    <mo stretchy="false">(</mo>
    <msub><mi>B</mi><mtext>DOM</mtext></msub>
    <mo>,</mo>
    <msub><mi>B</mi><mtext>Vision</mtext></msub>
    <mo stretchy="false">)</mo>
    <mo>=</mo>
    <mfrac>
      <mrow>
        <mtext>Area</mtext>
        <mo stretchy="false">(</mo>
        <msub><mi>B</mi><mtext>DOM</mtext></msub>
        <mo>&#x2229;</mo>
        <msub><mi>B</mi><mtext>Vision</mtext></msub>
        <mo stretchy="false">)</mo>
      </mrow>
      <mrow>
        <mtext>Area</mtext>
        <mo stretchy="false">(</mo>
        <msub><mi>B</mi><mtext>DOM</mtext></msub>
        <mo>&#x222a;</mo>
        <msub><mi>B</mi><mtext>Vision</mtext></msub>
        <mo stretchy="false">)</mo>
      </mrow>
    </mfrac>
  </mrow>
</math>
</body>
</html>
