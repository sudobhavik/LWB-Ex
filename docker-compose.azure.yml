services:
  demo-site:
    image: node:20-alpine
    container_name: guptchara-demo-site
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - PORT=8080
    command: node scripts/serve_demo.js
    restart: unless-stopped
    networks:
      - guptchara-net

  guptchara-browser:
    image: lscr.io/linuxserver/chromium:latest
    container_name: guptchara-streamed-browser
    depends_on:
      - demo-site
    security_opt:
      - seccomp:unconfined
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      # Launch Chromium with GUPTCHARA extension and navigate to demo site
      - CHROME_CLI=--no-sandbox --disable-gpu --disable-dev-shm-usage --start-maximized --no-first-run --no-default-browser-check --load-extension=/app/extension --disable-extensions-except=/app/extension http://demo-site:8080/index.html
    volumes:
      - ./extension:/app/extension:rw
      - ./chrome-config:/config
    ports:
      - "3000:3000"
      - "3001:3001"
    shm_size: "2gb"
    restart: unless-stopped
    networks:
      - guptchara-net

  caddy:
    image: caddy:2-alpine
    container_name: guptchara-caddy
    restart: unless-stopped
    depends_on:
      - guptchara-browser
    ports:
      - "80:80"
      - "443:443"
    environment:
      - AZURE_DOMAIN=${AZURE_DOMAIN:-guptchara-demo.malaysiawest.cloudapp.azure.com}
      - CADDY_TLS_DIRECTIVE=${CADDY_TLS_DIRECTIVE:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - guptchara-net

volumes:
  caddy_data:
  caddy_config:

networks:
  guptchara-net:
    driver: bridge
