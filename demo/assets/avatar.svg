<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <rect width="400" height="400" fill="#EFEFEA" rx="12"/>
  <!-- Head outline -->
  <ellipse cx="200" cy="190" rx="90" ry="115" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"/>
  <!-- Hair -->
  <path d="M 110 170 C 110 80, 290 80, 290 170 C 270 120, 240 110, 200 110 C 160 110, 130 120, 110 170 Z" fill="#1A1A1A"/>
  <!-- Eyebrows -->
  <path d="M 140 150 Q 165 142 180 150" stroke="#1A1A1A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 220 150 Q 235 142 260 150" stroke="#1A1A1A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="160" cy="165" rx="14" ry="9" fill="#1A1A1A"/>
  <ellipse cx="240" cy="165" rx="14" ry="9" fill="#1A1A1A"/>
  <circle cx="162" cy="163" r="3" fill="#FFFFFF"/>
  <circle cx="242" cy="163" r="3" fill="#FFFFFF"/>
  <!-- Nose -->
  <path d="M 200 165 L 195 205 L 208 205" stroke="#1A1A1A" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Mouth -->
  <path d="M 175 235 Q 200 250 225 235" stroke="#1A1A1A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Neck -->
  <rect x="175" y="300" width="50" height="40" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="4"/>
  <!-- Shoulders / Torso -->
  <path d="M 100 390 C 120 330, 280 330, 300 390" fill="#1A1A1A"/>
</svg>
