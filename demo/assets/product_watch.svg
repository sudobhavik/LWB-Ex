  <rect x="80" y="165" width="40" height="45" rx="4" fill="#FF9900"/>
  <!-- Watch Case -->
  <rect x="60" y="50" width="80" height="120" rx="20" fill="#232F3E" stroke="#131921" stroke-width="3"/>
  <rect x="66" y="56" width="68" height="108" rx="16" fill="#0F1111"/>
